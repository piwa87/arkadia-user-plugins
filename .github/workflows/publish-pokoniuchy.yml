name: Publish Pokoniuchy plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build plugins
        run: yarn build

      - name: Publish to Dargoth Client Plugins
        env:
          REGISTRY: https://arkadia-package-repository.vercel.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=arkadia-plugins" | jq -r '.value')
          curl -sS --fail-with-body -X POST "$REGISTRY/api/v1/publish" \
            -H "Authorization: Bearer $TOKEN" \
            -F "slug=pokoniuchy-plugin" \
            -F "version=$VERSION" \
            -F "changelog=Wydanie $VERSION" \
            -F "file=@dist/pokoniuchy-plugin.js"
