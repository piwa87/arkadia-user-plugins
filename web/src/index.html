<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sala Chwaly — Rendom Klub Dżenerejtor</title>
    <style>
      :root {
        --bg: #f7f6f3; --panel: #ffffff; --tekst: #1c1a17; --slaby: #6b6459;
        --linia: #e6e2da; --akcent: #b45309; --akcent-tlo: #fef3c7; --cień: rgba(0,0,0,.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17150f; --panel: #211d15; --tekst: #f0ebe0; --slaby: #a89f8d;
          --linia: #332c20; --akcent: #f0b429; --akcent-tlo: #3a2f14; --cień: rgba(0,0,0,.3);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--tekst);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
      header { text-align: center; margin-bottom: 20px; }
      h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.01em; }
      .podtytul { color: var(--slaby); font-size: .95rem; margin: 0; }
      #tabs { display: flex; gap: 6px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
      .tab {
        border: 1px solid var(--linia); background: var(--panel); color: var(--tekst);
        padding: 7px 16px; border-radius: 999px; cursor: pointer; font-size: .9rem;
      }
      .tab.akt { background: var(--akcent-tlo); border-color: var(--akcent); color: var(--akcent); font-weight: 600; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
      .wpis {
        display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--linia);
        border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 2px var(--cień);
      }
      .glosy { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 40px; }
      .strzalka {
        border: none; background: none; color: var(--slaby); cursor: pointer;
        font-size: 1.1rem; line-height: 1; padding: 2px 6px; border-radius: 6px;
      }
      .strzalka:hover { background: var(--akcent-tlo); }
      .strzalka.akt { color: var(--akcent); }
      .wynik { font-weight: 700; font-variant-numeric: tabular-nums; }
      .tresc { flex: 1; min-width: 0; }
      .nazwa { font-size: 1.15rem; font-weight: 650; }
      .rank { color: var(--slaby); font-weight: 700; margin-right: 8px; }
      .role { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--slaby); font-size: .82rem; }
      .meta { margin-top: 6px; color: var(--slaby); font-size: .8rem; }
      .pusto { text-align: center; color: var(--slaby); padding: 40px 0; }
      #wiecej {
        display: block; margin: 20px auto 0; padding: 9px 20px; border-radius: 999px;
        border: 1px solid var(--linia); background: var(--panel); color: var(--tekst); cursor: pointer;
      }
      #blad { text-align: center; color: #dc2626; min-height: 1.2em; margin-top: 10px; font-size: .9rem; }
      footer { text-align: center; color: var(--slaby); font-size: .8rem; margin-top: 30px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Sala Chwaly</h1>
        <p class="podtytul">Najzabawniejsze nazwy klubow z Rendom Klub Dżenerejtora</p>
      </header>
      <nav id="tabs"></nav>
      <ul id="lista"></ul>
      <p id="blad"></p>
      <button id="wiecej" hidden>Pokaz wiecej</button>
      <footer>Generuj w grze aliasem <code>rkg!</code>, potem wyslij z okna wtyczki.</footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
